org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 版本号唯一来源：Git 标签 v0.5.1 对应 app.versionName=0.5.1
app.versionName=0.5.2
app.versionCode=10

# 应用包名（applicationId）。高德 Key 绑定「包名 + 签名 SHA1」，每个自己编译的人
# 都必须改成自己的，否则会和本项目发布的安装包冲突，高德也会把调用量记到同一把 Key 上。
# 想省事就用 scripts/setup-my-app.ps1（Windows）或 scripts/setup-my-app.sh（macOS），
# 它会同时改应用名、生成签名并编译。
app.applicationId=com.hmilyld.daytrail

# 在线更新的 Release 仓库（OWNER/REPO）。
# 本项目的发布渠道就是它；别人用你的项目时必须改成自己的仓库，或留空。
# 留空 = 不启用在线更新（入口显示「未配置更新源」）。
app.updateRepo=hmilyld/daytrail
# 可选：覆盖 update.json 的完整地址，本地联调时指向一个 mock 文件。
app.updateFeedUrl=
