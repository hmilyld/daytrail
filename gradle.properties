org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 版本号唯一来源：Git 标签 v0.5.1 对应 app.versionName=0.5.1
app.versionName=0.5.1
app.versionCode=9

# 在线更新的 Release 仓库（OWNER/REPO）。
# 本项目的发布渠道就是它；fork 的用户改成自己的仓库即可，无需改代码。
# 留空 = 不启用在线更新（入口显示「未配置更新源」）。
app.updateRepo=hmilyld/daytrail
# 可选：覆盖 update.json 的完整地址，本地联调时指向一个 mock 文件。
app.updateFeedUrl=
