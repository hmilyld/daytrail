name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tag 就是发布身份，必须把 tag 与历史一起取下来
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      # 版本号的唯一来源是 gradle.properties；tag 必须与它一致，
      # 否则用户装到的版本和 Release 上写的不一样。
      - name: Check tag matches app.versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^app\.versionName=//p' gradle.properties)"
          if [ -z "$version" ]; then
            echo "::error::gradle.properties 缺少 app.versionName"
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 app.versionName=${version} 不一致"
            exit 1
          fi
          echo "发布 $version"

      - name: Extract release notes from CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v ver="$tag" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md 里没有 ${tag} 的小节；打 tag 前先写"
            exit 1
          fi

      # 可选：配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # 四个 repository secret 才会发布签名包。签名必须与已安装版本一致，
      # 否则用户无法覆盖安装。
      - name: Prepare signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "没有 KEYSTORE_BASE64，本次构建不签名"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify
        run: ./gradlew :app:spotlessCheck :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build release
        run: ./gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease --stacktrace

      - name: Build update.json
        run: |
          if [ ! -f keystore.properties ]; then
            echo "未签名构建：不生成 update.json，客户端会回退到 API 只给 Release 页面"
            printf '\n> 本次 APK 由 CI 构建但未签名，安装前请自行签名或改用本地构建产物。\n' >> release-notes.md
            echo "RELEASE_FILES<<EOF" >> "$GITHUB_ENV"
            echo "app/build/outputs/apk/release/*.apk" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
            exit 0
          fi
          apks=($(ls app/build/outputs/apk/release/*.apk))
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::期望恰好一个 release APK，实际 ${#apks[@]} 个"
            exit 1
          fi
          version="$(sed -n 's/^app\.versionName=//p' gradle.properties)"
          version_code="$(sed -n 's/^app\.versionCode=//p' gradle.properties)"
          node tools/write-update-manifest.mjs \
            --out update.json \
            --version "$version" \
            --code "$version_code" \
            --tag "${GITHUB_REF_NAME}" \
            --apk "${apks[0]}" \
            --notes release-notes.md \
            --repo "${GITHUB_REPOSITORY}"
          echo "RELEASE_FILES<<EOF" >> "$GITHUB_ENV"
          echo "${apks[0]}" >> "$GITHUB_ENV"
          echo "update.json" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: 行迹 ${{ github.ref_name }}
          body_path: release-notes.md
          files: ${{ env.RELEASE_FILES }}
          fail_on_unmatched_files: true
