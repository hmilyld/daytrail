name: 功能建议
description: 想要的功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先描述场景，再描述方案。例如「出差三天，回来只想看整体，不想逐日翻」。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 你愿意自己实现吗
      options:
        - 愿意提 PR
        - 需要指导
        - 只是建议
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **关于范围**：本项目的定位是「纯本地、离线优先的个人轨迹记录」，以下方向通常不会被接受：
        - 云端同步或账号体系（二期接缝已留，但现阶段不做）
        - 社交、分享、排行榜
        - 广告、统计 SDK、崩溃上报
        - 需要额外权限才能实现的功能（存储、通讯录、剪贴板等）
